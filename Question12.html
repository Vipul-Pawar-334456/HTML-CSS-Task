<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner</title>
</head>

<style>
    .spin{
        height: 100px;
        width: 100px;
        margin-left: 400px;
        margin-top: 400px;
        border: 6px solid rgb(38, 30, 187);
        border-top: 6px solid rgb(224, 234, 169);
        border-radius: 50%;
        animation: spinner 0.5s ease-in 0s infinite normal;
    }

    @keyframes spinner{
        from{ transform: rotate(0deg);}
        to{transform: rotate(360deg);}
    }
</style>
<body>
    
    <div class="spin"></div>

</body>
</html>
