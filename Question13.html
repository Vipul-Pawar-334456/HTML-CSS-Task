<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .pricing{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 100px;
        }

        .card{
            width: 220px;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card h2{
            color: blue;
        }

        .card h3{
            font-size: 30px;
        }

        .card button{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 15px;
        }

    </style>
</head>

<body>

    <div class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199</h3>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Pro</h2>
            <h3>₹499</h3>
            <p>5 Users</p>
            <p>50 GB Storage</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>Unlimited Users</p>
            <p>100 GB Storage</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
