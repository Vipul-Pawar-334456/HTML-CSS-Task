<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Pricing Section -->
    <div class="container py-5">

        <!-- Heading -->
        <div class="text-center mb-5">
            <h1 class="fw-bold">Choose Your Plan</h1>

            <p class="text-secondary">
                Select the plan that works best for you.
            </p>
        </div>


        <!-- Pricing Cards -->
        <div class="row g-4">

            <!-- Basic Plan -->
            <div class="col-md-4">

                <div class="bg-white p-4 rounded shadow text-center h-100">

                    <h2 class="fw-bold">Basic</h2>

                    <h3 class="display-5 fw-bold text-primary">
                        $9
                    </h3>

                    <p class="text-secondary">
                        per month
                    </p>

                    <hr>

                    <p>✓ 5 Projects</p>
                    <p>✓ 10GB Storage</p>
                    <p>✓ Email Support</p>

                    <button class="btn btn-outline-primary w-100 mt-3">
                        Choose Basic
                    </button>

                </div>

            </div>


            <!-- Pro Plan -->
            <div class="col-md-4">

                <div class="bg-primary text-white p-4 rounded shadow text-center h-100">

                    <span class="badge bg-warning text-dark mb-3">
                        Most Popular
                    </span>

                    <h2 class="fw-bold">Pro</h2>

                    <h3 class="display-5 fw-bold">
                        $19
                    </h3>

                    <p>
                        per month
                    </p>

                    <hr>

                    <p>✓ 20 Projects</p>
                    <p>✓ 50GB Storage</p>
                    <p>✓ Priority Support</p>

                    <button class="btn btn-light w-100 mt-3">
                        Choose Pro
                    </button>

                </div>

            </div>


            <!-- Enterprise Plan -->
            <div class="col-md-4">

                <div class="bg-white p-4 rounded shadow text-center h-100">

                    <h2 class="fw-bold">Enterprise</h2>

                    <h3 class="display-5 fw-bold text-primary">
                        $49
                    </h3>

                    <p class="text-secondary">
                        per month
                    </p>

                    <hr>

                    <p>✓ Unlimited Projects</p>
                    <p>✓ 500GB Storage</p>
                    <p>✓ 24/7 Support</p>

                    <button class="btn btn-primary w-100 mt-3">
                        Choose Enterprise
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
